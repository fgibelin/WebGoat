name: Sync upstream main

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: WebGoat/WebGoat
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: automation/sync-upstream-main

jobs:
  sync-upstream:
    if: github.repository != 'WebGoat/WebGoat'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin and upstream main
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin "${UPSTREAM_BRANCH}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Check for upstream updates
        id: check
        run: |
          origin_sha="$(git rev-parse "origin/${UPSTREAM_BRANCH}")"
          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          upstream_commits="$(git rev-list --count "origin/${UPSTREAM_BRANCH}..upstream/${UPSTREAM_BRANCH}")"
          echo "origin_sha=${origin_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          echo "upstream_commits=${upstream_commits}" >> "$GITHUB_OUTPUT"
          if [ "${upstream_commits}" -eq 0 ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_updates=true" >> "$GITHUB_OUTPUT"

      - name: Merge upstream main into local main
        if: steps.check.outputs.has_updates == 'true'
        run: git merge --no-edit "upstream/${UPSTREAM_BRANCH}"

      - name: Create pull request
        id: cpr
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.SYNC_BRANCH }}
          base: ${{ env.UPSTREAM_BRANCH }}
          delete-branch: true
          commit-message: Sync upstream main from WebGoat/WebGoat
          title: Sync upstream main from WebGoat/WebGoat
          body: |
            ## Summary
            - sync `${{ github.repository }}` with `${{ env.UPSTREAM_REPOSITORY }}`
            - apply `${{ steps.check.outputs.upstream_commits }}` upstream commit(s) from `${{ env.UPSTREAM_BRANCH }}`
            - update to upstream head `${{ steps.check.outputs.upstream_sha }}`

            ## Notes
            - created automatically by the daily upstream sync workflow

      - name: Merge pull request
        if: steps.check.outputs.has_updates == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch --auto \
          || gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --delete-branch
